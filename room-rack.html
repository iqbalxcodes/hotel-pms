<!DOCTYPE html>
<html lang="en">
<head>
    <!-- room-rack.html -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel PMS — Room Rack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/roomRack.css">
</head>
<body>
    
    <div id="pageHeaderBar" class="page-header-bar"></div>
    
    <div id="pageNavigation" data-page="room-rack"></div>
    <div class="table-container detail-card rack-page">

        <div class="reservation-header">

            <div class="header-title">
                <button class="icon-btn" onclick="history.back()" title="Kembali">← Back</button>
            </div>

            <div class="header-menu">
                <input type="date" id="rackDateInput" onchange="rackChangeSelectedDate(this.value)">

                <div class="rack-view-toggle">
                    <button class="rack-view-btn" data-mode="3" onclick="rackSetViewMode('3')">3D</button>
                    <button class="rack-view-btn" data-mode="7" onclick="rackSetViewMode('7')">7D</button>
                    <button class="rack-view-btn" data-mode="14" onclick="rackSetViewMode('14')">14D</button>
                    <button class="rack-view-btn" data-mode="30" onclick="rackSetViewMode('30')">30D</button>
                    <button class="rack-view-btn" data-mode="auto" onclick="rackSetViewMode('auto')">Auto</button>
                </div>
            </div>

        </div>


        <div id="toolbar">

            <div id="normalToolbar">
                <button onclick="rackToggleAllGroups()">Expand / Collapse All</button>
            </div>

            <!-- Kalau belum login, tombol2 ini otomatis di-disable oleh auth.js (class auth-required) -->
            <div id="selectionToolbar" style="display:none;">

                <span id="selectedCount">0 selected</span>

                <button class="auth-required" onclick="rackSetRoomStatus('DIRTY')">DIRTY</button>
                <button class="auth-required" onclick="rackSetRoomStatus('CLEAN')">CLEAN</button>
                <button class="auth-required" onclick="rackSetRoomStatus('INSPECTED')">INSPECTED</button>
                <button class="auth-required" onclick="rackSetRoomStatus('OUT_OF_SERVICE')">OUT OF SERVICE</button>
                <button class="auth-required" onclick="rackSetRoomStatus('BLOCKED')">BLOCKED</button>

            </div>

        </div>

        <div class="rack-scroll" id="rackScroll">
            <div id="rackHeaderRow" class="rack-header-row"></div>
            <div id="rackBody"></div>
        </div>

    </div>

    <div id="statusBar">
        <div id="userArea"></div>
        <div id="contextArea"></div>
        <div id="paginationInfo"></div>
        <div id="paginationNav"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/navigation.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/roomAvailability.js"></script>
    <script src="js/roomRack.js"></script>
    <script src="js/developmentStatusSimulator.js"></script>
    <script src="js/pageHeader.js"></script>
    <script>initPageHeader();</script>
    <script src="js/sidebar.js"></script>
    <script>initSidebar();</script>

</body>
</html>
