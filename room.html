<!DOCTYPE html>
<html lang="en">
<head>
    <!-- room.html -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel PMS — Room Management</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pmsTopbar.css">
    <link rel="stylesheet" href="/css/statusBadge.css">
    <link rel="stylesheet" href="/css/searchCardEngine.css">
    <link rel="stylesheet" href="/css/tableColumnsEngine.css">
    <link rel="stylesheet" href="/css/roomManagement.css">
</head>
<body>

    <div id="pageHeaderBar" class="page-header-bar"></div>

    <div id="pmsTopbar" data-page="room" data-hide-title="true"></div>

    <div class="rm-title-bar">
        <h3 class="rm-title">Room Management</h3>
        <span class="rm-title-sep">|</span>
        <div class="rm-summary-viewport">
            <div class="rm-summary-track" id="rmSummaryTrack"></div>
        </div>
    </div>

    <div class="table-container rm-page">

        <div class="rm-grid" id="rmGrid" data-view="list">

            <!-- ============================================== -->
            <!-- COLUMN 1 — Search card -->
            <!-- ============================================== -->

            <div class="rm-col rm-col-search">

                <div class="rm-card rm-search-card">
                    <form id="rmSearchForm">
                        <div class="sce-search-fields" id="rmSearchFields"></div>
                        <div class="rm-search-footer">
                            <button type="button" id="rmSearchClearBtn" class="rm-btn">Clear</button>
                            <button type="submit" class="rm-btn rm-btn-primary">Search</button>
                        </div>
                    </form>
                </div>

            </div>

            <!-- ============================================== -->
            <!-- COLUMN 2 — Showing card (search results + table, one card) -->
            <!-- ============================================== -->

            <div class="rm-col rm-col-showing">

                <div class="rm-card rm-showing-card">

                    <div class="rm-showing-header">
                        <span class="rm-showing-title">Room List</span>
                        <div id="rmSearchChips" class="rm-search-chips"></div>
                    </div>

                    <div class="rm-list-toolbar" id="rmSelectionToolbar" style="display:none;">
                        <span id="rmSelectedCount">0 selected</span>
                        <button id="rmDirtyBtn">DIRTY</button>
                        <button id="rmCleanBtn">CLEAN</button>
                        <button id="rmInspectedBtn">INSPECTED</button>
                        <button id="rmOooBtn">OUT OF SERVICE</button>
                        <button id="rmBlockedBtn">BLOCKED</button>
                    </div>

                    <div class="rm-list-scroll table-scroll">
                        <table id="rmRoomTable" class="rm-room-table">
                            <thead><tr></tr></thead>
                            <tbody id="rmRoomListBody"></tbody>
                        </table>
                    </div>

                    <div class="rm-table-footer">
                        <span id="rmPaginationInfo">0-0 of 0</span>
                        <div class="rm-page-nav">
                            <button id="rmPrevPage" type="button">‹ Prev</button>
                            <button id="rmNextPage" type="button">Next ›</button>
                        </div>
                    </div>

                </div>

            </div>

            <!-- ============================================== -->
            <!-- COLUMN 3 — Traces (local stub, not connected to DB yet) -->
            <!-- ============================================== -->

            <div class="rm-col rm-col-traces">

                <div class="rm-card rm-traces-card">
                    <h4>Traces</h4>
                    <div class="rm-mini-list" id="rmTracesList">
                        <div class="rm-empty-note">No traces yet</div>
                    </div>
                    <div class="rm-quick-add">
                        <input type="text" id="rmNewTraceText" placeholder="Add a trace / note">
                        <button id="rmAddTraceBtn">+ Add trace</button>
                    </div>
                </div>

            </div>

            <!-- ============================================== -->
            <!-- COLUMN 4 — Room Activity (global timeline) -->
            <!-- ============================================== -->

            <div class="rm-col rm-col-activity">
                <div class="rm-detail-scroll" id="rmActivityPane"></div>
            </div>

            <!-- ============================================== -->
            <!-- Room Detail — spans columns 3+4 when a room is clicked -->
            <!-- ============================================== -->

            <div class="rm-col rm-col-detail" id="rmDetailCol">
                <div class="rm-detail-scroll" id="rmDetailPane"></div>
            </div>

        </div>

    </div>

    <div id="statusBar">
        <div id="userArea"></div>
        <div id="contextArea"></div>
        <div id="paginationInfo"></div>
        <div id="paginationNav"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/activeProperty.js"></script>

    <script src="js/statusBadge.js"></script>
    <script src="js/roomTableConfig.js"></script>
    <script src="js/tableColumnsEngine.js"></script>
    <script src="js/searchCardEngine.js"></script>
    <script src="js/roomManagementData.js"></script>
    <script src="js/roomManagementUI.js"></script>
    <script src="js/roomManagement.js"></script>

    <script src="js/pageHeader.js"></script>
    <script>initPageHeader();</script>
    <script src="js/sidebar.js"></script>
    <script>initSidebar();</script>
    <script src="js/pmsTopbar.js"></script>
    <script src="js/statusBarClock.js"></script>

</body>
</html>
