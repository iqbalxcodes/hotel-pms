<div class="table-container">

    <div class="reservation-header">
        <h2>Reservation List</h2>
        <span id="clock"></span>
    </div>


    <!-- TOOLBAR -->
    <div id="toolbar">

        <!-- DEFAULT TOOLBAR -->
        <div id="normalToolbar">

            <button onclick="changeDate(-1)">
                ◀
            </button>


            <select
                id="dateScope"
                onchange="changeDateScope(this.value)"
            >
                <option value="today">
                    Today's
                </option>

                <option value="entire">
                    Entire
                </option>
            </select>


            <select
                id="modeSelect"
                onchange="changeMode(this.value)"
            >
                <option value="arrival">
                    Arrival
                </option>

                <option value="departure">
                    Departure
                </option>

                <option value="inhouse">
                    In House
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="cancelled">
                    Cancelled
                </option>
            </select>


            <input
                type="date"
                id="currentDate"
                onchange="changeSelectedDate(this.value)"
            >


            <button onclick="changeDate(1)">
                ▶
            </button>


            <button 
                id="addReservationBtn"
                onclick="showAddReservation()"
            >
                +
            </button>


            <button
                id="cancelAddBtn"
                onclick="hideAddReservation()"
                style="display:none;"
            >
                Cancel
            </button>


            <button onclick="showRoomList()">
                🛏
            </button>


            <button onclick="showClientList()">
                👤
            </button>


            <button onclick="showBilling()">
                ＄
            </button>


            <button onclick="showSearch()">
                🔍
            </button>


            <div id="searchContainer" style="display:none;">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search guest / room / ID"
                    onkeyup="searchReservation()"
                >

                <button onclick="hideSearch()">
                    ✕
                </button>

            </div>


            <button onclick="exportReservations()">
                Export
            </button>


        </div>



        <!-- SELECT TOOLBAR -->
        <div id="selectionToolbar" style="display:none;">

            <span id="selectedCount">
                0 selected
            </span>


            <button onclick="updateStatus('CHECKED_IN')">
                CHECK-IN
            </button>


            <button onclick="updateStatus('CHECKED_OUT')">
                CHECK-OUT
            </button>


            <button onclick="updateStatus('CANCELLED')">
                CANCEL
            </button>

        </div>


    </div>
    <!-- END TOOLBAR -->



    <!-- TABLE -->
    <table border="1">

        <thead>

            <tr>

                <th>
                    <input 
                        type="checkbox"
                        id="selectAll"
                        onchange="toggleAllCheckbox(this)"
                    >
                </th>


                <th onclick="sortTable('reservation')">
                    Reservation Number ↕
                </th>


                <th id="guestHeader" onclick="sortTable('guest')">

                    Guest ↕

                    <button onclick="event.stopPropagation(); enableEdit('guest')">
                        ✏️
                    </button>

                </th>


                <th id="roomHeader" onclick="sortTable('room')">

                    Room ↕

                    <button onclick="event.stopPropagation(); enableEdit('room')">
                        ✏️
                    </button>

                </th>


                <th id="arrivalHeader" onclick="sortTable('arrival')">

                    Arrival ↕

                    <button onclick="event.stopPropagation(); enableEdit('arrival','date')">
                        ✏️
                    </button>

                </th>


                <th id="departureHeader" onclick="sortTable('departure')">

                    Departure ↕

                    <button onclick="event.stopPropagation(); enableEdit('departure','date')">
                        ✏️
                    </button>

                </th>


                <th onclick="sortTable('status')">
                    Status ↕
                </th>


            </tr>

        </thead>


        <tbody id="reservationTable">

        </tbody>


    </table>


</div>
