<!DOCTYPE html>
<html lang="en">
<head>
    <!-- reservation.html -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2 https://unpkg.com https://www.googletagmanager.com https://www.google-analytics.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://www.google-analytics.com;">
    <title>Hotel PMS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pmsTopbar.css">
    <link rel="stylesheet" href="/css/reservationPage.css">
<base target="_blank">
</head>
<body>

    <div id="pageHeaderBar" class="page-header-bar"></div>

    <div id="pmsTopbar" data-page="reservation" data-hide-title="true"></div>

    <div id="addReservationPanel" style="display: none;">
        <h2>Add Reservation</h2>

        <button onclick="generateRandomReservations()">
            Generate Test Reservation
        </button>

        <button onclick="showDevelopmentAlert('Group Reservation')">
            Group Reservation
        </button>

        <form id="reservationForm">
            <input type="text" id="guest_name" placeholder="Guest Name" required>
            <input type="text" id="room_number" placeholder="Room Number" required>
            <input type="date" id="arrival_date" required>
            <input type="date" id="departure_date" required>

            <select id="status">
                <option value="PENDING">PENDING</option>
                <option value="CONFIRMED">CONFIRMED</option>
            </select>

            <button type="submit">Save Reservation</button>
        </form>

        <button id="cancelAddBtn" onclick="hideAddReservation()">Cancel</button>
    </div>

    <div class="rsv-page">

        <!-- ============================================== -->
        <!-- HEADER ROW -->
        <!-- ============================================== -->

        <div class="rsv-header-row">
            <h2>Reservations</h2>

            <div class="rsv-header-actions">
                <button id="addReservationBtn" class="rsv-btn rsv-btn-primary" onclick="createNewReservation()">
                    <i data-lucide="calendar-plus"></i><span class="rsv-btn-label">Add Reservation</span>
                </button>

                <button id="addBulkReservationBtn" class="rsv-btn" onclick="document.getElementById('addReservationPanel').style.display='block';">
                    <i data-lucide="copy-plus"></i><span class="rsv-btn-label">Bulk Reservation</span>
                </button>
            </div>
        </div>

        <!-- ============================================== -->
        <!-- SEARCH CARD -->
        <!-- ============================================== -->

        <div class="rsv-card rsv-search-card">
            <h3>Search</h3>

            <form id="rsvSearchForm">

                <div class="rsv-search-fields" id="rsvSearchFields"></div>

                <div class="rsv-search-footer">
                    <button type="submit" class="rsv-btn rsv-btn-primary">
                        <i data-lucide="search"></i><span class="rsv-btn-label">Search</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- ============================================== -->
        <!-- SHOWING CARD -->
        <!-- ============================================== -->

        <div class="rsv-card rsv-showing-card">

            <div class="rsv-showing-header">

                <span class="rsv-showing-title">Showing</span>

                <div class="rsv-showing-center">

                    <div class="rsv-showing-pills" id="rsvShowingPills">
                        <button class="rsv-pill-arrow" onclick="changeDate(-1)"><i data-lucide="chevron-left"></i></button>

                        <select id="dateScope" class="rsv-pill-select" onchange="changeDateScope(this.value)">
                            <option value="today">Today's</option>
                            <option value="entire">Entire</option>
                        </select>

                        <select id="modeSelect" class="rsv-pill-select" onchange="changeMode(this.value)">
                            <option value="arrival">Arrival</option>
                            <option value="departure">Departure</option>
                            <option value="inhouse">In House</option>
                            <option value="pending">Pending</option>
                            <option value="cancelled">Cancelled</option>
                            <option value="noshow">No Show</option>
                        </select>

                        <input type="date" id="currentDate" class="rsv-pill-date" onchange="changeSelectedDate(this.value)">

                        <button class="rsv-pill-arrow" onclick="changeDate(1)"><i data-lucide="chevron-right"></i></button>
                    </div>

                    <div class="rsv-search-chips" id="rsvSearchChips"></div>

                </div>

                <button class="rsv-btn rsv-export-btn" onclick="exportReservations()">
                    <i data-lucide="download"></i><span class="rsv-btn-label">Export</span>
                </button>

            </div>

            <!-- placeholder wajib, dipakai reservationUI.js buat toggle
                 pas ada baris ke-select (lihat updateActionBar) -->
            <div id="normalToolbar"></div>

            <div id="selectionToolbar" style="display:none;">

                <span id="selectedCount">0 selected</span>

                <button onclick="updateStatus('CHECKED_IN')">CHECK-IN</button>
                <button onclick="updateStatus('CHECKED_OUT')">CHECK-OUT</button>
                <button onclick="updateStatus('CANCELLED')">CANCEL</button>

                <button onclick="openBulkEditPopover()">✏️ Edit Field</button>

            </div>

            <div id="bulkEditPopover" class="bulk-edit-popover" style="display:none;">

                <label>Column</label>
                <select id="bulkEditColumn" onchange="renderBulkEditValueInput()"></select>

                <label>New Value</label>
                <div id="bulkEditValueContainer"></div>

                <div class="bulk-edit-popover-footer">
                    <button onclick="closeBulkEditPopover()">Cancel</button>
                    <button id="bulkEditApplyBtn" onclick="applyBulkEdit()">Apply</button>
                </div>

            </div>

            <div class="table-scroll">

                <table>

                    <colgroup id="reservationColgroup"></colgroup>

                    <thead>
                        <tr id="reservationHeaderRow"></tr>
                    </thead>

                    <tbody id="reservationTable"></tbody>

                </table>

            </div>

        </div>

    </div>

    <div id="statusBar">
        <div id="userArea"></div>
        <div id="contextArea"></div>
        <div id="paginationInfo"></div>
        <div id="paginationNav"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/activeProperty.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/guestData.js"></script>
    <script src="js/roomData.js"></script>
    <script src="js/tableConfig.js"></script>
    <script src="js/tableColumns.js"></script>
    <script src="js/tableScrollEdge.js"></script>

    <script src="js/reservationUI.js"></script>

    <script src="js/reservationFilter.js"></script>
    <script src="js/reservation.js"></script>
    <script src="js/bulkEdit.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/pageHeader.js"></script>
    <script>initPageHeader();</script>
    <script src="js/sidebar.js"></script>
    <script>initSidebar();</script>
    <script src="js/pmsTopbar.js"></script>
    <script src="js/reservationPage.js"></script>

    <script src="js/export.js"></script>
    <script src="js/developmentStatusSimulator.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XSST5HZ5L9"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-XSST5HZ5L9');
    </script>
</body>
</html>
